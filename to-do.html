<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1">
        <!--==================== UNICONS ====================-->
        <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.0/css/line.css">
        
        <!--==================== CSS ====================-->
        <link rel="stylesheet" href="assets/css/to-do/styles.css">

        <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.0/css/line.css">

        <title>elio - about</title>
    </head>
    <body>
        <!--==================== HEADER ====================-->
        <header class="header" id="header">
            <nav class="nav container">
                <a href="https://elioexe.tech" class="nav__logo">elio</a>

                <div class="nav__menu" id="nav-menu">
                    <ul class="nav__list grid">
                        <li class="nav__item">
                             <a href="https://elioexe.tech" class="nav__link">
                                <i class="uil uil-estate nav__icon"></i> home
                             </a>
                        </li>
                        <li class="nav__item">
                            <a href="about" class="nav__link">
                                <i class="uil uil-user nav__icon"></i> about
                            </a>
                       </li>
                       <li class="nav__item">
                            <a href="blog" class="nav__link">
                                <i class="uil uil-book nav__icon"></i> blog
                            </a>
                        </li>
                        <li class="nav__item">
                            <a href="projects" class="nav__link">
                                <i class="uil uil-folder nav__icon"></i> projects
                            </a>
                        </li>
                    </ul>
                    <i class="uil uil-times nav__close" id="nav-close"></i>
                </div>

                <div class="nav__btns">
                    <!-- Theme Change Button -->
                    <i class="uil uil-moon change-theme" id="theme-button">
                    </i>

                    <i class="uil uil-notes todo__button">
                        <a href="to-do"></a>
                    </i>

                    <div class="nav__toggle" id="nav-toggle">
                        <i class="uil uil-apps"></i>
                    </div>
                </div>
            </nav>
        </header>

        <!--==================== MAIN ====================-->
        <main class="main">
            <section class="to-do section" id="to-do">
                <h2 class="section__title">to do</h2>
                <span class="section__subtitle">your very own to do list</span>
            <div class="wrapper">
                <div class="task-input">
                  <img src="assets/img/bars-icon.svg" alt="icon">
                  <input type="text" placeholder="add a new task" style="font-family: 'DM Mono', monospace;">
                </div>
                <div class="controls">
                  <div class="filters">
                    <span class="active" id="all">all</span>
                    <span id="pending">pending</span>
                    <span id="completed">completed</span>
                  </div>
                  <button class="clear-btn" style="font-family: 'DM Mono', monospace;">clear</button>
                </div>
                <ul class="task-box"></ul>
              </div>          
            </section>
        </main>
        <!--==================== FOOTER ====================-->
        <footer class="footer">
            <div class="footer__bg">
                <div class="footer__container container grid">
                    <div>
                        <h1 class="footer__title">elio</h1>
                        <span class="footer__subtitle">student</span>
                    </div>

                    <ul class="footer__links">
                        <li>
                            <a href="https://elioexe.tech" class="footer__link">home</a>
                        </li>
                        <li>
                            <a href="about" class="footer__link">about</a>
                        </li>
                        <li>
                            <a href="blog" class="footer__link">blog</a>
                        </li>
                        <li>
                            <a href="projects" class="footer__link">projects</a>
                        </li>
                    </ul>

                   <div class="footer__socials">
                       <a href="https://github.com/eliohd" target="_blank" class="footer__social">
                        <i class="uil uil-github-alt"></i>
                       </a>
                   </div> 
                </div>
                <p class="footer__copy">&#169; elio. all rights reserverd</p>
            </div>
        </footer>
        <!--==================== MAIN JS ====================-->
        <script src="assets/js/to-do/main.js"></script>
    </body>
</html>
